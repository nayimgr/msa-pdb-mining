[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msa-pdb-mining"
version = "0.1.0"
description = "Build an MSA for a protein and color it by experimental-structure (PDB) coverage depth across orthologs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.24",
    "biopython>=1.79",
    "pyfamsa>=0.5",
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "jinja2>=3.0",
    "platformdirs>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
msa-pdb-mining = "msa_pdb_mining.cli:main"

[tool.setuptools.packages.find]
include = ["msa_pdb_mining*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
